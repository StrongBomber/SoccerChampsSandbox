name: The Boys mod paketi

# BitLife icin The Boys modunu paketler: frida-server + ajan.
# Oyunun APK'si DEGISMEZ ve dagitilmaz. Cikti: theboys-mod-magisk.zip

on:
  push:
    branches:
      - arena/a59d6787-soccerchampssandbox
    paths:
      - "bitlife/**"
      - "tools/build-mod-zip.sh"
      - "tools/theboys.sh"
      - "tests/theboys-test.mjs"
      - "tests/theboys-ui-test.mjs"
      - "tests/android-mock.mjs"
      - "tests/frida-mock.mjs"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ajan mantık testi
        run: node tests/theboys-test.mjs

      - name: Arayüz testi (Android çerçeve taklidi)
        run: node tests/theboys-ui-test.mjs

      - name: frida-server indir (android-arm)
        id: fdi
        run: |
          set -eu
          URL=$(curl -fsSL https://api.github.com/repos/frida/frida/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*android-arm\.xz"' \
            | head -1 | sed 's/.*"\(https[^"]*\)"/\1/')
          [ -n "$URL" ] || { echo "frida-server asset bulunamadı" >&2; exit 1; }
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "indiriliyor: $URL"

      - name: Mod paketini üret
        env:
          FDI_SERVER_URL: ${{ steps.fdi.outputs.url }}
          MOD_VERSION: "1.0"
          MOD_VERSION_CODE: "1"
        run: bash tools/build-mod-zip.sh

      - name: Paketi doğrula
        run: |
          set -eu
          Z=dist/theboys-mod-magisk.zip
          test -s "$Z"
          unzip -l "$Z" | tee /tmp/list.txt
          for f in module.prop customize.sh post-fs-data.sh service.sh agent/theboys-mod.js system/bin/frida-server; do
            unzip -l "$Z" "$f" | grep -q "$f" || { echo "eksik: $f" >&2; exit 1; }
          done
          unzip -p "$Z" module.prop | grep -q "id=boysmod"
          unzip -p "$Z" agent/theboys-mod.js | grep -q "THE BOYS MOD"
          # ajan dosyası repodakiyle birebir aynı olmalı
          unzip -p "$Z" agent/theboys-mod.js > /tmp/agent.js
          cmp /tmp/agent.js bitlife/theboys-mod.js
          file_size=$(unzip -p "$Z" system/bin/frida-server | wc -c)
          echo "frida-server: $file_size bayt"
          test "$file_size" -gt 1000000 || { echo "frida-server çok küçük" >&2; exit 1; }
          sha256sum "$Z" | tee dist/sha.txt
          unzip -l "$Z" > dist/MOD-CONTENTS.txt
          cp bitlife/theboys-mod.js dist/theboys-mod.js

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: theboys-mod-magisk
          path: |
            dist/theboys-mod-magisk.zip
            dist/theboys-mod-magisk.zip.sha256
            dist/MOD-CONTENTS.txt
            dist/theboys-mod.js

      - name: Release'e ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="theboys-mod"
          {
            echo "BitLife icin The Boys modu — calisma aninda mod paketi (Magisk / KernelSU)."
            echo ""
            echo "Oyunun APK'si DEGISMEZ ve bu pakette YOKTUR: mod, kendi cihazindaki kurulu"
            echo "kopyaya runtime'da enjekte edilir. Ticari oyunun kopyasi dagitilmaz."
            echo ""
            echo "- Icerik: frida-server (android-arm) + The Boys ajani + acilista otomatik baslatma"
            echo "- Kurulum: Magisk uzerinden zip'i flash et, oyunu ac, PC'den tools/theboys.sh --attach"
            echo "- Menu: Tara (para/yas/gorunum/zeka/saglik...) / The Boys (10 karakter + Vought) / Istatistik / Kayit"
            echo "- Oyun APK'si, paket adi ve imzasi korunur"
            echo ""
            echo "Ayrica: theboys-mod.js tek basina (frida -U -f com.candywriter.bitlife -l theboys-mod.js)"
          } > NOTES.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "The Boys Mod (BitLife) - runtime paket" --notes-file NOTES.md
          fi
          gh release upload "$TAG" \
            dist/theboys-mod-magisk.zip \
            dist/theboys-mod-magisk.zip.sha256 \
            dist/MOD-CONTENTS.txt \
            dist/theboys-mod.js --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bayt"'
