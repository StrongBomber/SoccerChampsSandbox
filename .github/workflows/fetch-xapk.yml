name: Fetch XAPK from Google Drive

# Tetikleme: push. (workflow_dispatch, dosyanin varsayilan dalda olmasini gerektirir;
# bu sandbox dali varsayilan dal degil.)
on:
  push:
    branches:
      - arena/a59d6787-soccerchampssandbox
    paths:
      - .github/workflows/fetch-xapk.yml
      - scripts/download_drive.sh

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FILE_ID: 1q83CaQEAi8ELOoG966wQr87VPqvCUFfv
      FILE_NAME: World+Soccer+Champs_2026.12_APKPure-1.xapk
      EXPECTED_SIZE: "237511212"
      RELEASE_TAG: wsc-2026.12
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download from Google Drive
        run: bash scripts/download_drive.sh "$FILE_ID" "$FILE_NAME"

      - name: Verify integrity
        run: |
          set -euo pipefail
          size=$(stat -c%s "$FILE_NAME")
          echo "size=$size expected=$EXPECTED_SIZE"
          [ "$size" = "$EXPECTED_SIZE" ] || { echo "::error::size mismatch"; exit 1; }
          unzip -l "$FILE_NAME" | head -25
          sha256sum "$FILE_NAME" | tee SHA256SUMS.txt

      - name: Publish as GitHub release asset
        run: |
          set -euo pipefail
          {
            echo "Kaynak: Google Drive (APKPure paketi)"
            echo ""
            echo "- Dosya: $FILE_NAME"
            echo "- Boyut: 237.511.212 bayt (~226 MB)"
            echo "- SHA-256: SHA256SUMS.txt dosyasinda"
          } > notes.md
          gh release create "$RELEASE_TAG" \
            --title "World Soccer Champs 2026.12 (APKPure) - XAPK" \
            --notes-file notes.md || true
          gh release upload "$RELEASE_TAG" "$FILE_NAME" SHA256SUMS.txt --clobber
