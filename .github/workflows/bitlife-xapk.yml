name: BitLife XAPK — tam paket, The Boys metin yaması

# Neden ayrı hat: Google Play BitLife'ı App Bundle olarak dağıtır. Tek başına
# indirilen "BitLife.apk" yalnızca base split'tir; manifest
# requiredSplitTypes="base__abi" der ve lib/ içermez. Bu yüzden tek başına
# kurulamaz (INSTALL_FAILED_MISSING_SPLIT).
#
# Bu hat, base + config split'lerini içeren XAPK/APKS dosyasını alır:
#   1. base'in metin havuzunu The Boys evrenine çevirir
#   2. TÜM parçaları aynı anahtarla imzalar (kurulum için zorunlu)
#   3. SAI/APKPure'un kurduğu tek bir XAPK üretir
#
# Tetikleme: trigger/bitlife-xapk/ altındaki dosyayı değiştirip push et.
# Girdi: DRIVE_XAPK_ID (aşağıdaki env) — Drive'daki .xapk / .apks / .apkm dosyası.

on:
  workflow_dispatch:
  push:
    paths:
      - "trigger/bitlife-xapk/**"

concurrency:
  group: bitlife-xapk
  cancel-in-progress: false

permissions:
  contents: write

env:
  DRIVE_XAPK_ID: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Araçlar (build-tools)
        run: |
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          [ -n "$BT" ] && echo "$BT" >> "$GITHUB_PATH"
          zipalign -h >/dev/null 2>&1 && echo "zipalign ok"
          apksigner --version || echo "apksigner yok"

      - name: XAPK'yı Drive'dan indir
        id: dl
        run: |
          set +e
          if [ -z "$DRIVE_XAPK_ID" ]; then
            echo "::notice::DRIVE_XAPK_ID boş — tam paket bekleniyor"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash tools/drive-fetch.sh "$DRIVE_XAPK_ID" "$RUNNER_TEMP/bundle.xapk"
          if [ $? -ne 0 ] || [ ! -s "$RUNNER_TEMP/bundle.xapk" ]; then
            echo "::error::XAPK indirilemedi (dosya özel olabilir ya da kimlik yanlış)"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=1" >> "$GITHUB_OUTPUT"
          unzip -l "$RUNNER_TEMP/bundle.xapk" | head -20

      - name: Parçaları çıkar ve base'i belirle
        id: parts
        if: ${{ steps.dl.outputs.ok == '1' }}
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          rm -rf parts && mkdir parts
          unzip -q -o bundle.xapk -d extracted
          find extracted -name '*.apk' -maxdepth 3 -exec cp {} parts/ \;
          echo "--- parçalar ---"; ls -l parts
          BASE=""
          if [ -f extracted/manifest.json ]; then
            BASE=$(python3 -c "import json;m=json.load(open('extracted/manifest.json'));b=[a for a in m.get('split_apks',[]) if a.get('id')=='base'];print(b[0]['file'] if b else '')")
          fi
          [ -n "$BASE" ] || BASE=$(ls parts | grep -vi 'config\|split' | head -1)
          echo "base: $BASE"
          cp "parts/$BASE" parts/base.apk
          [ "$BASE" = "base.apk" ] || rm -f "parts/$BASE"
          echo "base=base.apk" >> "$GITHUB_OUTPUT"
          ls -l parts

      - name: base'i yamala (The Boys metin havuzu)
        id: patch
        if: ${{ steps.dl.outputs.ok == '1' }}
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          cp parts/base.apk base-original.apk
          python3 "$GITHUB_WORKSPACE/tools/apk-text-patch.py" \
            parts/base.apk "$GITHUB_WORKSPACE/tools/theboys-text-patch.json" parts/base-patched.apk apk-analiz
          mv parts/base-patched.apk parts/base.apk
          N=$(python3 -c 'import json;print(json.load(open("apk-analiz/text-patch.json"))["applied"])')
          echo "applied=$N" >> "$GITHUB_OUTPUT"
          echo "yamalanan çift: $N"

      - name: Tüm parçaları aynı anahtarla imzala
        if: ${{ steps.dl.outputs.ok == '1' && steps.patch.outputs.applied != '0' }}
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          if gh release download bitlife-theboys -p mod-signing.jks -O mod-signing.jks 2>/dev/null; then
            echo "mevcut anahtar indirildi"
          else
            keytool -genkeypair -v -keystore mod-signing.jks -storepass theboysmod -keypass theboysmod \
              -alias theboys -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=The Boys Mod, O=BitLifeSandbox, C=TR"
          fi
          rm -rf signed && mkdir signed
          for f in parts/*.apk; do
            n=$(basename "$f")
            zipalign -P 16 -f -p 4 "$f" "signed/aligned-$n" 2>/dev/null || zipalign -f -p 4 "$f" "signed/aligned-$n"
            apksigner sign --ks mod-signing.jks --ks-pass pass:theboysmod --key-pass pass:theboysmod \
              --ks-key-alias theboys --min-sdk-version 25 \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --out "signed/$n" "signed/aligned-$n"
            rm -f "signed/aligned-$n"
            echo "imzalandı: $n"
          done
          echo "--- imza özetleri (hepsi aynı olmalı) ---"
          for f in signed/*.apk; do
            apksigner verify --print-certs "$f" 2>/dev/null | grep -m1 "SHA-256 digest" | sed "s|^|$(basename "$f"): |"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: base'i denetle
        if: ${{ steps.dl.outputs.ok == '1' && steps.patch.outputs.applied != '0' }}
        run: |
          set +e
          python3 "$GITHUB_WORKSPACE/tools/apk-doctor.py" "$RUNNER_TEMP/signed/base.apk" \
            --reference "$RUNNER_TEMP/base-original.apk" --out apk-analiz
          echo "rc=$?"
          python3 "$GITHUB_WORKSPACE/tools/apk-verify-patch.py" "$RUNNER_TEMP/signed/base.apk" \
            tools/theboys-text-patch.json apk-analiz

      - name: XAPK'yı kur
        if: ${{ steps.dl.outputs.ok == '1' && steps.patch.outputs.applied != '0' }}
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          python3 "$GITHUB_WORKSPACE/tools/xapk-assemble.py" signed "$RUNNER_TEMP/bitlife-theboys.xapk"
          sha256sum bitlife-theboys.xapk | tee bitlife-theboys.xapk.sha256
          unzip -l bitlife-theboys.xapk

      - name: Raporu işle
        if: always()
        run: |
          set +e
          git config user.name "bitlife-bot"
          git config user.email "bitlife-bot@users.noreply.github.com"
          git add -A apk-analiz
          git commit -m "xapk(bitlife): tam paket raporu [skip ci]" || echo "değişiklik yok"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push atlandı"

      - name: Release'e yükle
        if: ${{ steps.patch.outputs.applied != '' && steps.patch.outputs.applied != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="bitlife-theboys-xapk"
          cat > NOTES.md <<'EOF'
          BitLife — The Boys metin yamasi (TAM PAKET, XAPK).

          Google Play BitLife'i App Bundle olarak dagittigi icin tek bir APK
          kurulamaz (base split, requiredSplitTypes="base__abi"). Bu XAPK
          base + config split'lerini icerir ve hepsi AYNI anahtarla imzalanmistir.

          Kurulum: XAPK dosyasini SAI (Split APKs Installer) veya APKPure ile ac.
          Onceki BitLife kurulumunu kaldir (imza farkli).

          - Degisen: base icindeki global-metadata.dat metin havuzu (The Boys)
          - Degismeyen: split'lerin icerigi, oyun kodu
          EOF
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "BitLife — The Boys (XAPK, tam paket)" --notes-file NOTES.md
          gh release upload "$TAG" \
            "$RUNNER_TEMP/bitlife-theboys.xapk#bitlife-theboys.xapk" \
            "$RUNNER_TEMP/bitlife-theboys.xapk.sha256#bitlife-theboys.xapk.sha256" \
            --clobber
          gh release edit "$TAG" --notes-file NOTES.md
