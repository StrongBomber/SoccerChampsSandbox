name: Analyze XAPK with REA

# REA (https://github.com/morluto/rea) ile World Soccer Champs XAPK'sini statik analiz eder.
# Cikti: engine tespiti, IL2CPP metadata envanteri ve (varsa) libil2cpp.so method adres linkleri.
on:
  push:
    branches:
      - arena/a59d6787-soccerchampssandbox
    paths:
      - .github/workflows/analyze-xapk.yml
      - scripts/download_drive.sh

permissions:
  contents: read

env:
  REA_VERSION: 6.8.0
  FILE_ID: 1q83CaQEAi8ELOoG966wQr87VPqvCUFfv
  FILE_NAME: World+Soccer+Champs_2026.12_APKPure-1.xapk

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Download XAPK from Google Drive
        run: bash scripts/download_drive.sh "$FILE_ID" "src.xapk"

      - name: Unpack XAPK
        run: |
          set -euo pipefail
          mkdir -p xapk out
          unzip -o -q src.xapk -d xapk
          echo "=== XAPK icerigi ===" | tee out/00-listing.txt
          unzip -l src.xapk | tee -a out/00-listing.txt
          echo "=== dosya turleri ===" | tee -a out/00-listing.txt
          find xapk -type f -print0 | xargs -0 file | tee -a out/00-listing.txt
          ls -la xapk

      - name: Install REA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea"
          npm install --prefix "$RUNNER_TEMP/rea" --no-audit --no-fund "rea-agents@$REA_VERSION"
          echo "REA_BIN=$RUNNER_TEMP/rea/node_modules/.bin/rea" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/rea/node_modules/.bin/rea" --version

      - name: Detect engine and extract native payloads
        run: |
          set -euo pipefail
          BASE=$(find xapk -maxdepth 1 -name 'base.apk' | head -1)
          [ -n "$BASE" ] || BASE=$(find xapk -maxdepth 1 -name '*.apk' | head -1)
          echo "BASE_APK=$BASE" >> "$GITHUB_ENV"
          mkdir -p out/base
          unzip -o -q "$BASE" -d out/base || true
          {
            echo "=== base.apk ABI/lib envanteri ==="
            unzip -l "$BASE" | awk '{print $4}' | grep -Ev '^$' | grep -E '^(lib|assets|classes)' | head -80
            echo
            echo "=== Unity izleri ==="
            for f in $(unzip -Z1 "$BASE" | grep -E 'libil2cpp\.so|libunity\.so|libmono\.so|global-metadata\.dat|unity\.default|assets/bin/Data' | head -20); do
              echo "  $f"
            done
          } | tee out/01-engine.txt

          for split in xapk/*.apk; do
            [ "$split" = "$BASE" ] && continue
            echo "--- split: $split" | tee -a out/01-engine.txt
            unzip -l "$split" | grep -E '\.so$|metadata' | head -20 | tee -a out/01-engine.txt
          done

      - name: IL2CPP metadata inventory (REA)
        id: il2cpp
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== tum .dat/.so adaylari ===" | tee out/02-il2cpp.txt
          find xapk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            echo "## $apk" | tee -a out/02-il2cpp.txt
            unzip -Z1 "$apk" | grep -E 'global-metadata\.dat|libil2cpp\.so' | head | tee -a out/02-il2cpp.txt || true
          done

          # global-metadata.dat genelde bir split apk icinde assets/bin/Data/Managed/Metadata/ altinda olur
          mkdir -p out/native
          for apk in xapk/*.apk; do
            if unzip -Z1 "$apk" | grep -q 'global-metadata.dat'; then
              unzip -o -j -q "$apk" '*global-metadata.dat' -d out/native
              echo "metadata kaynagi: $apk" | tee -a out/02-il2cpp.txt
            fi
            if unzip -Z1 "$apk" | grep -q 'libil2cpp.so'; then
              mkdir -p "out/native/lib-$(basename "$apk" .apk)"
              unzip -o -j -q "$apk" '*arm64-v8a/libil2cpp.so' -d "out/native/lib-$(basename "$apk" .apk)" || true
            fi
          done
          ls -la out/native || true

          META=$(find out/native -name 'global-metadata.dat' | head -1)
          if [ -z "$META" ]; then
            echo "global-metadata.dat bulunamadi (Unity IL2CPP olmayabilir)." | tee -a out/02-il2cpp.txt
            exit 0
          fi
          echo "META=$META" >> "$GITHUB_ENV"
          LIB=$(find out/native -path '*arm64-v8a*' -name 'libil2cpp.so' | head -1 || true)
          echo "LIB=$LIB" >> "$GITHUB_ENV"
          echo "metadata=$META lib=${LIB:-yok}" | tee -a out/02-il2cpp.txt

          ARGS=(--detail summary --evidence_output "$PWD/out/il2cpp-evidence.json" --json)
          if [ -n "$LIB" ]; then ARGS+=(--binary "$LIB" --architecture arm64); fi
          set +e
          "$REA_BIN" inspect-il2cpp-metadata "$META" "${ARGS[@]}" \
            > out/il2cpp-summary.json 2> out/il2cpp-summary.stderr
          echo "exit=$?" | tee -a out/02-il2cpp.txt
          set -e
          head -c 4000 out/il2cpp-summary.json

      - name: APK manifest inventory (REA / JADX)
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set -euo pipefail
          "$REA_BIN" inspect-android-package "$BASE_APK" --detail summary --json \
            > out/android-package.json 2> out/android-package.stderr || true
          head -c 4000 out/android-package.json

      - name: Summary
        run: |
          set -euo pipefail
          ls -laR out | head -60
          du -sh out

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rea-analysis
          path: out
          retention-days: 30
          if-no-files-found: warn
