name: Analyze XAPK with REA

# REA (https://github.com/morluto/rea, MIT) ile World Soccer Champs XAPK'sini statik analiz eder:
#   * motor tespiti (Unity IL2CPP?),
#   * IL2CPP global-metadata envanteri,
#   * libil2cpp.so method adres linkleri (mod menu hook'lari icin RVA'lar),
#   * APK manifest envanteri (JADX).
# Sonuclar `analysis/` altina commit edilir; tam Evidence artifact olarak yuklenir.
on:
  push:
    branches:
      - arena/a59d6787-soccerchampssandbox
    paths:
      - .github/workflows/analyze-xapk.yml
      - scripts/download_drive.sh
      - scripts/rea_reduce.py
  workflow_dispatch:

permissions:
  contents: write

env:
  REA_VERSION: 6.8.0
  FILE_NAME: World+Soccer+Champs_2026.12_APKPure-1.xapk

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Download XAPK from the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p out
          gh release download wsc-2026.12 --pattern '*.xapk' --output src.xapk
          ls -la src.xapk
          echo "size=$(stat -c%s src.xapk) (beklenen 237511212)" | tee out/00-download.txt

      - name: Unpack XAPK
        run: |
          set -eu
          mkdir -p xapk
          unzip -o -q src.xapk -d xapk
          {
            echo "=== XAPK icerigi ==="
            unzip -l src.xapk
            echo
            echo "=== dosya turleri ==="
            find xapk -type f -printf '%p  ' -exec sh -c 'file -b "$1"' _ {} \;
          } > out/00-listing.txt 2>&1 || true
          tail -40 out/00-listing.txt
          ls -la xapk

      - name: Install REA
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/rea"
          npm install --prefix "$RUNNER_TEMP/rea" --no-audit --no-fund "rea-agents@$REA_VERSION"
          echo "REA_BIN=$RUNNER_TEMP/rea/node_modules/.bin/rea" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/rea/node_modules/.bin/rea" --version | tee out/01-rea-version.txt

      - name: Detect engine and extract native payloads
        run: |
          set -eu
          : > out/02-engine.txt
          # Paket APK'si = AndroidManifest.xml + classes.dex iceren split
          PKG_APK=""
          for apk in xapk/*.apk; do
            if unzip -Z1 "$apk" | grep -q '^AndroidManifest.xml$' && unzip -Z1 "$apk" | grep -q '^classes.*\.dex$'; then
              PKG_APK="$apk"; break
            fi
          done
          [ -n "$PKG_APK" ] || PKG_APK=$(find xapk -maxdepth 1 -name '*.apk' -print -quit)
          echo "PKG_APK=$PKG_APK" >> "$GITHUB_ENV"
          {
            echo "=== paket apk: $PKG_APK ($(stat -c%s "$PKG_APK") bayt) ==="
            echo
            echo "=== tum split'ler ==="
            ls -la xapk
            echo
            echo "=== dex dosyalari ==="
            unzip -Z1 "$PKG_APK" | grep -E '^classes.*\.dex$' || true
            echo
            echo "=== arm64-v8a native kutuphane envanteri ==="
            unzip -Z1 "$PKG_APK" | grep -E '^lib/' || true
            echo
            echo "=== motor isaretleri ==="
            for marker in libunity.so libil2cpp.so libmono.so libflutter.so libcocos2d libgodot unity.default global-metadata.dat assets/bin/Data libmain.so; do
              if unzip -Z1 "$PKG_APK" | grep -q "$marker"; then echo "  VAR   $marker"; else echo "  yok   $marker"; fi
            done
            echo
            echo "=== assets ust duzey (ilk 120) ==="
            unzip -Z1 "$PKG_APK" | grep -E '^assets/' | head -120 || true
            echo
            echo "=== ilk 60 giris ==="
            unzip -Z1 "$PKG_APK" | head -60 || true
          } > out/02-engine.txt 2>&1 || true
          cat out/02-engine.txt

      - name: "Deep probe - native markers, dex packages, save-format hints"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -eu
          mkdir -p out/probe
          unzip -o -j -q "$PKG_APK" 'lib/*/libWorldSoccerChamps.so' -d out/probe 2>/dev/null || true
          unzip -o -q "$PKG_APK" 'classes*.dex' -d out/probe 2>/dev/null || true
          {
            echo "=== native kutuphane ==="
            ls -la out/probe/*.so 2>/dev/null || echo "(libWorldSoccerChamps.so yok)"
            for so in out/probe/*.so; do
              [ -f "$so" ] || continue
              echo "--- $so"
              echo "  ELF: $(file -b "$so")"
              echo "  il2cpp/mono/unity sembolleri:"
              strings -n 6 "$so" | grep -Ei 'il2cpp_init|il2cpp_domain_get|il2cpp_class_from_name|mono_image_open|UnityPlayer' | sort -u | head -20 || true
              echo "  IL2CPP metadata imzasi (0xFAB11BAF):"
              strings -n 6 "$so" | grep -c 'global-metadata' || true
              echo "  oyun veri anahtarlari (ilk 40):"
              strings -n 5 "$so" | grep -Ei '^(money|budget|transfer|wage|contract|player|club|finances?)' | sort -u | head -40 || true
              echo "  sqlite/json/save izleri:"
              strings -n 6 "$so" | grep -Ei 'sqlite|\.sav\b|playerprefs|savegame|persistentDataPath' | sort -u | head -20 || true
            done
            echo
            echo "=== dex: paket/uygulama siniflari ==="
            for dex in out/probe/classes*.dex; do
              [ -f "$dex" ] || continue
              echo "--- $dex"
              strings -n 8 "$dex" | grep -E '^L(com|io|net|org)/[a-zA-Z0-9_/]+;' | sed 's/^L//; s/;$//' | cut -d/ -f1-3 | sort -u | head -40 || true
            done
            echo
            echo "=== dex: koruma/guc izleri ==="
            for dex in out/probe/classes*.dex; do
              strings -n 6 "$dex" | grep -Ei 'pairip|playcore|integrity|rootbeer|frida|signature.*check|licensing' | sort -u | head -20 || true
            done
            echo
            echo "=== asset veri dosyalari (db/json/csv/sav) ==="
            unzip -Z1 "$PKG_APK" | grep -Ei '\.(db|sqlite|json|csv|sav|dat|bin|asset)$' | head -60 || true
          } > out/05-probe.txt 2>&1 || true
          cat out/05-probe.txt

      - name: IL2CPP metadata inventory (REA)
        id: il2cpp
        run: |
          set -eu
          mkdir -p out/native
          for apk in xapk/*.apk; do
            if unzip -Z1 "$apk" | grep -q 'global-metadata.dat'; then
              unzip -o -j -q "$apk" '*global-metadata.dat' -d out/native
              echo "metadata kaynagi: $apk" >> out/03-il2cpp.txt
            fi
            if unzip -Z1 "$apk" | grep -q 'libil2cpp.so'; then
              d="out/native/lib-$(basename "$apk" .apk)"
              mkdir -p "$d"
              unzip -o -j -q "$apk" '*arm64-v8a/libil2cpp.so' -d "$d" 2>/dev/null || true
            fi
          done
          find out/native -type f -printf '%p %s\n' | tee -a out/03-il2cpp.txt || true

          META=$(find out/native -name 'global-metadata.dat' -print -quit || true)
          if [ -z "$META" ]; then
            echo "global-metadata.dat bulunamadi -> Unity IL2CPP degil." | tee out/04-il2cpp-result.txt
            exit 0
          fi
          LIB=$(find out/native -name 'libil2cpp.so' -print -quit || true)
          echo "META=$META LIB=${LIB:-yok}" | tee out/04-il2cpp-result.txt

          ARGS=(--detail summary --evidence_output "$PWD/out/il2cpp-evidence.json" --json)
          if [ -n "$LIB" ]; then ARGS+=(--binary "$LIB" --architecture arm64); fi
          set +e
          "$REA_BIN" inspect-il2cpp-metadata "$META" "${ARGS[@]}" \
            > out/il2cpp-summary.json 2> out/il2cpp-summary.stderr
          RC=$?
          set -e
          echo "rea_exit=$RC" | tee -a out/04-il2cpp-result.txt
          head -c 1500 out/il2cpp-summary.json | tee -a out/04-il2cpp-result.txt
          if [ -f out/il2cpp-evidence.json ]; then
            python3 scripts/rea_reduce.py out/il2cpp-evidence.json analysis | tee -a out/04-il2cpp-result.txt
          fi

      - name: APK manifest inventory (REA / JADX)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set -eu
          "$REA_BIN" inspect-android-package "$PKG_APK" --detail summary --json \
            > out/android-package.json 2> out/android-package.stderr || true
          head -c 2000 out/android-package.json || true

      - name: Publish analysis results to the branch
        if: always()
        run: |
          set -eu
          git config user.name "rea-bot"
          git config user.email "rea-bot@users.noreply.github.com"
          mkdir -p analysis
          cp -f out/00-listing.txt out/02-engine.txt out/03-il2cpp.txt out/04-il2cpp-result.txt out/05-probe.txt analysis/ 2>/dev/null || true
          ls -la analysis
          git add analysis
          git commit -m "analysis: REA static analysis of World Soccer Champs 2026.12" || echo "degisiklik yok"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-analysis
          path: out
          retention-days: 14
          if-no-files-found: warn
