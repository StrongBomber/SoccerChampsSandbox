name: Mod ajanı testleri

# Oyun modu tarafı: Frida ajanının mantığı ve kayıt yaması aracı.
# Cihaz gerekmez — sahte Frida çalışma zamanı ile sınanır.

on:
  push:
    branches:
      - arena/a59d6787-soccerchampssandbox
    paths:
      - "modmenu/**"
      - "tools/**"
      - "tests/game-mod-test.mjs"
      - "tests/frida-mock.mjs"
      - ".github/workflows/mod-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kabuk betiği sözdizimi (game-mod.sh)
        run: bash -n tools/game-mod.sh

      - name: Frida ajanı mantık testi (27 iddia)
        run: node tests/game-mod-test.mjs

      - name: Kayıt tarayıcı + yama duman testi
        run: |
          set -eu
          node tools/save-scan.mjs sandbox-editor/demo-save.json --max 3 > /tmp/scan.txt
          grep -q "PARA / BÜTÇE adayları" /tmp/scan.txt
          grep -q "KABİLİYET adayları" /tmp/scan.txt
          node tools/save-scan.mjs sandbox-editor/demo-save.json \
            --patch "transferBudget=123456789,ca=200" --out /tmp/patched.json
          node -e '
            const d = require("/tmp/patched.json");
            if (d.club.finances.transferBudget !== 123456789) throw new Error("bütçe yamalanmadı");
            if (!d.players.every(p => p.ca === 200)) throw new Error("CA yamalanmadı");
            console.log("yama doğrulandı:", d.players.length, "oyuncu");
          '

      - name: Özet
        run: |
          echo "### Mod ajanı testleri geçti" >> $GITHUB_STEP_SUMMARY
          echo "- Frida ajanı: tarama / daraltma / yazma / dondurma / kayıt API" >> $GITHUB_STEP_SUMMARY
          echo "- save-scan: biçim tespiti + alan yaması" >> $GITHUB_STEP_SUMMARY
