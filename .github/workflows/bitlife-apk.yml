name: BitLife APK — indir, analiz et, modla

# Drive'daki BitLife APK'sını GitHub runner'ında indirir (runner'ın ağı açık),
# apktool ile açar, içerik modelini çıkarır, The Boys içeriğini oyunun kendi
# veri dosyalarına yazar ve modlanmış APK'yı imzalayıp Release'e koyar.
#
# Tetikleme:
#   - trigger/bitlife/ altındaki bir dosyayı değiştirip push et  (dal çalışır)
#   - ya da elle: gh workflow run bitlife-apk.yml --ref <dal>

on:
  workflow_dispatch:
  push:
    paths:
      - "trigger/bitlife/**"

concurrency:
  group: bitlife-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Araçlar (apktool, build-tools)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set +e
          echo "== uname =="; uname -a
          echo "== java =="; java -version 2>&1 | head -2
          echo "== ortam =="; env | grep -Ei 'android|java_home' | sort
          mkdir -p "$HOME/tools"

          APKTOOL_OK=no
          # 1) apt
          sudo apt-get update -qq >/dev/null 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq apktool >/dev/null 2>&1
          if command -v apktool >/dev/null 2>&1; then
            apktool --version && APKTOOL_OK=yes && echo "APKTOOL=apktool" >> "$GITHUB_ENV"
          fi
          # 2) jar (github)
          if [ "$APKTOOL_OK" = "no" ]; then
            URL=$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
              | grep -o 'https://[^"]*apktool_[0-9.]*\.jar' | head -1)
            echo "jar url: ${URL:-yok}"
            [ -n "$URL" ] || URL="https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"
            curl -fL --retry 3 "$URL" -o "$HOME/tools/apktool.jar"
            if java -jar "$HOME/tools/apktool.jar" --version; then
              echo "APKTOOL=java -jar $HOME/tools/apktool.jar" >> "$GITHUB_ENV"
              APKTOOL_OK=yes
            fi
          fi
          echo "apktool durumu: $APKTOOL_OK"

          # build-tools
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk "$HOME/android-sdk"; do
            [ -n "$d" ] && [ -d "$d/build-tools" ] && ls -d "$d"/build-tools/* 2>/dev/null
          done | sort -V | tail -1 > "$RUNNER_TEMP/bt.txt"
          BT=$(cat "$RUNNER_TEMP/bt.txt")
          echo "build-tools: ${BT:-yok}"
          if [ -n "$BT" ]; then echo "$BT" >> "$GITHUB_PATH"; fi
          [ -x "$BT/zipalign" ] && zipalign -h 2>&1 | head -2
          [ -x "$BT/apksigner" ] && apksigner --version

          echo "== dosyalar =="; ls -l "$HOME/tools" 2>/dev/null
          [ "$APKTOOL_OK" = "yes" ] && [ -n "$BT" ] || echo "ARAÇ EKSİK: apktool=$APKTOOL_OK build-tools=${BT:-yok}"
          true

      - name: APK'yı Drive'dan indir
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set -eu
          bash tools/drive-fetch.sh "${DRIVE_ID:-19nxS1vrw5oP56ymsumXNRUMXmgA90-ef}" "$RUNNER_TEMP/bitlife.apk"
          cp "$RUNNER_TEMP/bitlife.apk" "$RUNNER_TEMP/original.apk"
          ls -l "$RUNNER_TEMP/bitlife.apk"
          unzip -l "$RUNNER_TEMP/bitlife.apk" | head -30
          echo "--- en büyük 20 girdi ---"
          unzip -l "$RUNNER_TEMP/bitlife.apk" | sort -k1 -n -r | head -22

      - name: XAPK/APKS ise base APK'yı çıkar
        id: unpack
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set -eu
          cd "$RUNNER_TEMP"
          TOP=$(unzip -l bitlife.apk | awk 'NF>=4 && $4 ~ /^[^\/]+\.apk$/ {print $4}' | head -5)
          echo "üst düzey .apk girdileri: ${TOP:-yok}"
          if [ -n "$TOP" ]; then
            echo "→ XAPK/APKS, base ayrılıyor"
            rm -rf xapk && mkdir -p xapk && unzip -q -o bitlife.apk -d xapk
            if [ -f xapk/manifest.json ]; then
              node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("xapk/manifest.json","utf8"));(m.split_apks||[]).forEach(a=>console.log(a.id+" "+a.file));'
              F=$(node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("xapk/manifest.json","utf8"));const b=(m.split_apks||[]).find(a=>a.id==="base");console.log(b?b.file:"")')
            fi
            [ -n "${F:-}" ] || F=$(echo "$TOP" | head -1)
            cp "xapk/$F" base.apk
            echo "base: $F"
          else
            cp bitlife.apk base.apk
          fi
          ls -l base.apk
          echo "apk=$RUNNER_TEMP/base.apk" >> "$GITHUB_OUTPUT"

      - name: Unity + içerik + literal sondaları
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set +e
          python3 -m pip install --quiet --disable-pip-version-check UnityPy brotli
          echo "== unity-inspect =="
          python3 tools/unity-inspect.py "$RUNNER_TEMP/base.apk" apk-analiz
          echo "rc(unity)=$?"
          echo "== content-probe =="
          python3 tools/content-probe.py "$RUNNER_TEMP/base.apk" apk-analiz
          echo "rc(probe1)=$?"
          echo "== content-probe2 =="
          python3 tools/content-probe2.py "$RUNNER_TEMP/base.apk" apk-analiz
          echo "rc(probe2)=$?"
          echo "== metadata literal dökümü =="
          python3 tools/metadata-literals.py dump "$RUNNER_TEMP/base.apk" apk-analiz/literals.json
          echo "rc(literals)=$?"
          echo "== metadata literal tablosu — kesin yer =="
          python3 tools/meta-map2.py "$RUNNER_TEMP/base.apk" apk-analiz
          echo "rc(map2)=$?"
          echo "== metadata tablo çözümü =="
          python3 tools/meta-map.py "$RUNNER_TEMP/base.apk" apk-analiz
          echo "rc(map)=$?"
          echo "== metadata metin havuzu dilimi =="
          python3 - "$RUNNER_TEMP/base.apk" <<'PYH'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              raw = z.read("assets/bin/Data/Managed/Metadata/global-metadata.dat")
          import gzip
          lo, hi = 680000, 1920000
          body = raw[lo:hi]
          open("apk-analiz/meta-pool2.bin.gz", "wb").write(gzip.compress(body, 9))
          print("havuz 2:", lo, "-", hi, "=", len(body), "bayt (gz)", len(gzip.compress(body, 9)))
          print("havuz dilimi:", lo, "-", hi, "=", hi - lo, "bayt")
          PYH
          echo "rc(slice)=$?"
          ls -la apk-analiz/literals.json 2>/dev/null || echo "literals.json YOK"
          # 40 MB üstü artefakt kırp
          find apk-analiz -type f -size +20M -delete || true
          git config user.name "bitlife-bot"
          git config user.email "bitlife-bot@users.noreply.github.com"
          git add -A apk-analiz
          git commit -m "analiz(bitlife): unity + içerik + literal dökümü [skip ci]" || echo "değişiklik yok"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push atlandı"
          true

      - name: APK'yı aç (apktool)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set -eu
          cd "$RUNNER_TEMP"
          rm -rf decoded
          $APKTOOL d -f -o decoded base.apk > apktool.log 2>&1 || { tail -40 apktool.log; exit 1; }
          tail -5 apktool.log
          du -sh decoded

      - name: İçerik modelini çıkar
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set -eu
          node tools/apk-analyze.mjs "$RUNNER_TEMP/decoded" apk-analiz | tee apk-analiz-stdout.txt
          cp "$RUNNER_TEMP/apktool.log" apk-analiz/apktool.log || true

      - name: Analizi repoya işle
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set -eu
          git config user.name "bitlife-bot"
          git config user.email "bitlife-bot@users.noreply.github.com"
          git add -A apk-analiz
          git commit -m "analiz(bitlife): APK içerik modeli [skip ci]" || echo "değişiklik yok"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push atlandı"

      - name: The Boys içeriğini oyunun verisine yaz
        id: inject
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set -eu
          set +e
          node tools/apk-inject.mjs "$RUNNER_TEMP/decoded" apk-analiz/model.json apk-analiz
          RC=$?
          set -e
          echo "exit=$RC"
          echo "rows=$(node -e 'console.log(require("./apk-analiz/injection.json").total_rows)' 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          git add -A apk-analiz || true
          git commit -m "enjeksiyon(bitlife): The Boys içeriği [skip ci]" || echo "değişiklik yok"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push atlandı"
          if [ "$RC" = "3" ]; then
            echo "::warning::Oyunun veri dosyalarında enjekte edilebilir içerik tablosu bulunamadı"
          fi

      - name: The Boys metin yaması (oyunun kendi metin havuzu)
        id: textpatch
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set -eu
          python3 "$GITHUB_WORKSPACE/tools/apk-text-patch.py" \
            "$RUNNER_TEMP/base.apk" tools/theboys-text-patch.json \
            "$RUNNER_TEMP/patched.apk" apk-analiz
          N=$(python3 -c 'import json;print(json.load(open("apk-analiz/text-patch.json"))["applied"])')
          echo "yamalanan=$N"
          echo "applied=$N" >> "$GITHUB_OUTPUT"
          git config user.name "bitlife-bot"
          git config user.email "bitlife-bot@users.noreply.github.com"
          git add -A apk-analiz
          git commit -m "yama(bitlife): The Boys metin yaması ($N çift) [skip ci]" || echo "değişiklik yok"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push atlandı"

      - name: Yeniden paketle (zip yaması)
        if: ${{ always() && steps.unpack.outcome == 'success' }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set -eu
          cd "$RUNNER_TEMP"
          SRC=base.apk
          [ -f patched.apk ] && SRC=patched.apk
          echo "taban: $SRC"
          python3 "$GITHUB_WORKSPACE/tools/apk-repack.py" "$SRC" decoded unsigned.apk
          ls -l unsigned.apk
          unzip -t unsigned.apk | tail -2

      - name: İmzalama anahtarı (sabit)
        if: ${{ always() && steps.unpack.outcome == 'success' }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set -eu
          if gh release download bitlife-theboys -p mod-signing.jks -O "$RUNNER_TEMP/mod-signing.jks" 2>/dev/null; then
            echo "mevcut anahtar indirildi"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/mod-signing.jks" -storepass theboysmod -keypass theboysmod \
              -alias theboys -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=The Boys Mod, O=BitLifeSandbox, C=TR"
            echo "yeni anahtar üretildi"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hizala + imzala
        if: ${{ always() && steps.unpack.outcome == 'success' }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/diag.log") 2>&1
          set -eu
          cd "$RUNNER_TEMP"
          BT=$(dirname "$(command -v zipalign || echo /usr/local/lib/android/sdk/build-tools/37.0.0/zipalign)")
          export PATH="$BT:$PATH"
          zipalign -f -p 4 unsigned.apk aligned.apk
          apksigner sign --ks mod-signing.jks --ks-pass pass:theboysmod --key-pass pass:theboysmod \
            --ks-key-alias theboys --out theboys-signed.apk aligned.apk
          apksigner verify --print-certs theboys-signed.apk | tee certs.txt
          ls -l theboys-signed.apk
          unzip -l theboys-signed.apk | head -20
          sha256sum theboys-signed.apk | tee theboys-signed.apk.sha256

      - name: Release'e yükle
        if: ${{ always() && steps.textpatch.outputs.applied != '' && steps.textpatch.outputs.applied != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="bitlife-theboys"
          cat > NOTES.md <<'EOF'
          BitLife APK — The Boys metin yamasi.

          Bu APK, Drive'dan alinan gercek BitLife kurulumundan (com.candywriter.bitlife)
          uretildi. APK apktool ile acildi, icerik modeli cikarildi, oyunun kendi metin
          havuzu (global-metadata.dat string literalleri) The Boys evrenine cevrildi,
          yeniden paketlendi ve sabit anahtarla imzalandi.

          - Degisen sey: oyunun gosterdigi METINLER (meslek/olay cumleleri, Vought,
            Homelander, Supe gonderileri). Her yama birebir ayni bayt uzunlugundadir,
            bu yuzden literal tablosu ve dosya yapisi bozulmaz.
          - Degismeyen sey: meslek ve olay SINIFLARI. BitLife'ta meslekler derlenmis
            IL2CPP siniflaridir (ornek: AstronautJobPack); yeni meslek/bolum eklemek
            yeniden derleme gerektirir, veri tablosu yok.
          - Ayrintili rapor: depodaki apk-analiz/ (METIN-YAMASI.md, ANALIZ.md,
            CONTENT-PROBE.md, UNITY.md)
          - Imza farkli oldugu icin kurmadan once orijinal BitLife'i kaldir.
          - Yalnizca kendi cihazin icin. Oyun dosyalari sende kaliyor.
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "BitLife — The Boys modu (APK)" --notes-file NOTES.md
          fi
          gh release upload "$TAG" \
            "$RUNNER_TEMP/theboys-signed.apk#bitlife-theboys.apk" \
            "$RUNNER_TEMP/theboys-signed.apk.sha256#bitlife-theboys.apk.sha256" \
            "$RUNNER_TEMP/mod-signing.jks#mod-signing.jks" \
            --clobber
          gh release edit "$TAG" --notes-file NOTES.md

      - name: Özet
        if: always()
        run: |
          {
            echo "## BitLife APK hattı"
            echo ""
            echo "- APK: $(wc -c < "$RUNNER_TEMP/base.apk" 2>/dev/null || echo '?') bayt"
            echo "- Enjekte edilen satır: ${{ steps.inject.outputs.rows }}"
            echo "- Metin yaması: ${{ steps.textpatch.outputs.applied }} çift"
            echo ""
            cat apk-analiz/METIN-YAMASI.md 2>/dev/null | head -40 || echo "metin yaması raporu yok"
            echo ""
            cat apk-analiz/ANALIZ.md 2>/dev/null | head -60 || echo "analiz yok"
            echo ""
            cat apk-analiz/INJEKSIYON.md 2>/dev/null | head -60 || echo "enjeksiyon raporu yok"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tanılama (her durumda)
        if: always()
        run: |
          set +e
          mkdir -p apk-analiz
          {
            echo "# Tanılama"
            echo ""
            echo "sürüm: $(date -u +%FT%TZ)"
            echo ""
            echo '```'
            grep -nE "rc\(|literal|sonda|hata|YOK|Error|Traceback|builtin|APKTOOL|build-tools|değişen girdi|yamalandı|imza|Signer|rows=" "$RUNNER_TEMP/diag.log" 2>/dev/null | tail -80 || echo "özet satır yok"
            echo '--- son 120 satır ---'
            tail -120 "$RUNNER_TEMP/diag.log" 2>/dev/null || echo "log yok"
            echo '```'
            echo ""
            echo "## artifacts"
            ls -lh "$RUNNER_TEMP" 2>/dev/null | head -30
          } > apk-analiz/TANILAMA.md
          git config user.name "bitlife-bot"
          git config user.email "bitlife-bot@users.noreply.github.com"
          git add -A apk-analiz
          git commit -m "tanilama(bitlife) [skip ci]" || echo "değişiklik yok"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push atlandı"
