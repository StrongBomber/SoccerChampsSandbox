<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>In-Game Editor — World Soccer Champs</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="desktop">
  <div class="window">

    <header class="titlebar">
      <div class="brand">
        <span class="brand-badge">FM</span>
        <div class="brand-text">
          <strong>In-Game Editor</strong>
          <span id="brandSub">World Soccer Champs · 2026/27</span>
        </div>
      </div>

      <div class="global-search">
        <span class="search-ico">⌕</span>
        <input id="globalSearch" type="search" placeholder="Oyuncu, personel veya kulüp ara…" autocomplete="off" />
      </div>

      <div class="title-actions">
        <span class="dirty-pill" id="dirtyPill">Kaydedildi</span>
        <button class="btn ghost" id="undoBtn" title="Son düzenlemeyi geri al (Ctrl+Z)">↶ Geri Al</button>
        <button class="btn primary" id="saveBtn">Değişiklikleri Kaydet</button>
      </div>
    </header>

    <nav class="section-tabs" id="tabs"></nav>

    <main class="editor-body">
      <div id="view"></div>
    </main>

    <footer class="statusbar">
      <span id="statusLeft">Hazır</span>
      <span id="statusRight"></span>
    </footer>

  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
