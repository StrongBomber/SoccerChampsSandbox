<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>In-Game Editor — World Soccer Champs</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="desktop">
  <div class="window">

    <header class="titlebar">
      <div class="brand">
        <span class="brand-badge">FM</span>
        <div class="brand-text">
          <strong>In-Game Editor</strong>
          <span id="brandSub">World Soccer Champs · 2026/27</span>
        </div>
      </div>

      <div class="global-search">
        <span class="search-ico">⌕</span>
        <input id="globalSearch" type="search" placeholder="Oyuncu, personel veya kulüp ara…" autocomplete="off" />
      </div>

      <div class="palette" id="palette" hidden></div>

      <div class="title-actions">
        <button class="dirty-pill" id="reviewBtn" title="Bekleyen değişiklikleri incele (Ctrl+R)">Kaydedildi</button>
        <button class="btn ghost" id="undoBtn" title="Son düzenlemeyi geri al (Ctrl+Z)">↶ Geri Al</button>
        <button class="btn primary" id="saveBtn">Değişiklikleri Kaydet</button>
      </div>
    </header>

    <nav class="section-tabs" id="tabs"></nav>

    <main class="editor-body">
      <div id="view"></div>
    </main>

    <div class="mobile-bar">
      <button class="mbtn" id="mUndo">↶ Geri Al</button>
      <button class="mbtn" id="mReview">Bekleyen <b id="mCount">0</b></button>
      <button class="mbtn primary" id="mSave">Kaydet</button>
    </div>

    <footer class="statusbar">
      <button class="status-chip" id="statusLeft">Hazır</button>
      <span class="status-mid" id="statusIssues"></span>
      <span id="statusRight"></span>
    </footer>

  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="review-drawer" id="review" hidden aria-label="Bekleyen değişiklikler">
  <header class="review-head">
    <div>
      <h2>Bekleyen Değişiklikler</h2>
      <p id="reviewSub">0 düzenleme</p>
    </div>
    <button class="btn ghost" id="reviewClose">✕</button>
  </header>
  <div class="review-body" id="reviewBody"></div>
  <footer class="review-foot">
    <button class="btn" id="revertAllBtn">Tümünü Geri Al</button>
    <button class="btn primary" id="saveFromReview">Kaydet ve Kapat</button>
  </footer>
</aside>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
